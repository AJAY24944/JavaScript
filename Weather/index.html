<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Plant UI</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="cool">
  <div class="bg">
    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>
  </div>

  <div class="main-layout">
    <div class="plant-wrapper">
      <div class="plant" id="plant">
        <div class="pot"></div>
        <div class="stem"></div>
        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="flower"></div>
      </div>
      <p class="plant-status" id="plantStatus">Fresh and happy</p>
    </div>

    <div class="app">
      <div class="weather-card">
        <div class="top-section">
          <div class="title-box">
            <h1>Weather Magic</h1>
            <p>Smart weather with colorful vibes</p>
          </div>

          <div class="cartoon">
            <div class="hair"></div>
            <div class="face">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="smile"></span>
            </div>
            <div class="body"></div>
            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>
          </div>
        </div>

        <div class="search-box">
          <input type="text" id="input" placeholder="Enter city name" />
          <button onclick="showWeather()">Check Weather</button>
        </div>

        <div id="weather" class="weather-output">
          <p class="placeholder">Search a city to see the weather</p>
        </div>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
